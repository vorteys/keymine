# PostgreSQL pour le développement local (alternative à `bun run db:dev`).
#   docker compose up -d
#   DATABASE_URL="postgresql://keymine:keymine@localhost:5432/keymine"
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: keymine
      POSTGRES_PASSWORD: keymine
      POSTGRES_DB: keymine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
